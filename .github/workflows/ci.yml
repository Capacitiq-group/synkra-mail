name: ci

# Build register 3.2 + 3.8: format, build, vet, test with the cache disabled in
# a fresh process, against a real Postgres. The E2E suite creates its database
# once per process, so -count=1 in CI is the rule (an intermittent bounce-breaker
# failure once hid behind Go's test cache).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SYNKRA_MAIL_TEST_URL: postgres://postgres:postgres@localhost:5432/synkra_mail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt (no unformatted files)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test (fresh process, cache disabled)
        run: go test -count=1 ./...

  # 3.9 — dependency scanning and a software bill of materials, from P0.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: SBOM (module list artifact)
        run: |
          go list -mod=readonly -m all > sbom.txt
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.txt
